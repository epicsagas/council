[package]
name = "mcp-council"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "MCP server for multi-LLM peer review and council deliberation workflow"
repository = "https://github.com/epicsagas/mcp-council"
homepage = "https://github.com/epicsagas/mcp-council"
documentation = "https://github.com/epicsagas/mcp-council#readme"
readme = "README.md"
keywords = ["mcp", "llm", "ai", "peer-review", "council"]
categories = ["command-line-utilities", "development-tools"]
authors = ["epicsagas"]
rust-version = "1.92"

[lib]
name = "mcp_council"
path = "src/lib.rs"

[[bin]]
name = "mcp-council"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
llm-kernel = { version = "0.31", features = ["mcp", "client-async", "provider", "tokens", "safety"] }
reqwest = "0.13"
