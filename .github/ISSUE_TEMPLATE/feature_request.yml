name: Feature request
description: Propose a change to the council pattern or panel
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or failure mode is not served today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Concretely, what would change in `skills/council/SKILL.md` or the docs?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I ran `/council` with the current skill and confirmed the gap is real
          required: false
        - label: This keeps the project a single skill file (no servers, no build)
          required: false
